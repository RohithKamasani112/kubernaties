<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44A08D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main cloud shape -->
  <path d="M120 200 C120 170, 145 145, 175 145 C185 125, 210 110, 240 110 C275 110, 305 135, 315 170 C340 175, 360 195, 360 220 C360 250, 340 275, 315 280 L135 280 C110 275, 90 250, 90 220 C90 210, 95 200, 105 195 C110 195, 115 197, 120 200 Z" fill="url(#cloudGradient1)"/>
  
  <!-- Secondary cloud -->
  <path d="M80 160 C80 140, 95 125, 115 125 C120 115, 135 105, 155 105 C175 105, 195 120, 200 140 C215 142, 230 155, 230 170 C230 185, 215 200, 200 202 L95 202 C80 200, 70 185, 70 170 C70 165, 72 160, 76 157 C78 157, 79 158, 80 160 Z" fill="url(#cloudGradient2)" opacity="0.8"/>
  
  <!-- Network nodes and connections -->
  <g fill="white" opacity="0.9">
    <!-- Nodes -->
    <circle cx="150" cy="180" r="6"/>
    <circle cx="200" cy="160" r="6"/>
    <circle cx="250" cy="180" r="6"/>
    <circle cx="180" cy="200" r="6"/>
    <circle cx="220" cy="200" r="6"/>
    <circle cx="200" cy="220" r="6"/>
    
    <!-- Connections -->
    <line x1="150" y1="180" x2="200" y2="160" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="200" y1="160" x2="250" y2="180" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="150" y1="180" x2="180" y2="200" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="200" y1="160" x2="180" y2="200" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="200" y1="160" x2="220" y2="200" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="250" y1="180" x2="220" y2="200" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="180" y1="200" x2="200" y2="220" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="220" y1="200" x2="200" y2="220" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Upward arrow indicating growth/scaling -->
  <path d="M200 300 L185 320 L195 320 L195 340 L205 340 L205 320 L215 320 Z" fill="url(#arrowGradient)" opacity="0.8"/>
  
  <!-- Data flow indicators -->
  <g opacity="0.6">
    <circle cx="120" cy="140" r="3" fill="#4ECDC4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="150" r="3" fill="#667eea">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="190" r="3" fill="#4ECDC4">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="200" r="3" fill="#667eea">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
